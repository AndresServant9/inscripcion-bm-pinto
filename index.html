<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscripción 2027/2028 · Balonmano Pinto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#242424;font:16px/1.5 system-ui,sans-serif}main{max-width:780px;margin:auto;padding:18px}header{background:#242424;color:white;border-radius:16px;padding:24px;display:flex;gap:20px;align-items:center}header img{width:75px}h1,h2{margin:0 0 .4em}header p{margin:0;color:#f6e34e}fieldset,section{background:white;border:1px solid #dedbd5;border-radius:12px;padding:18px;margin:20px 0;min-width:0}legend{font-weight:750}label{display:block;margin:.6rem 0}input:not([type=radio]):not([type=checkbox]),select,textarea{display:block;width:100%;padding:10px;border:1px solid #aaa;border-radius:6px;font:inherit}button{border:0;border-radius:7px;padding:12px 16px;background:#b60934;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#242424}small{display:block;color:#555}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 16px}output{display:block;font-weight:750}ul{padding-left:1.3rem}[hidden]{display:none!important}
.authorization{margin:.6rem 0}.authorization a{color:#a20830;font-weight:650;text-underline-offset:.2em}dialog{width:min(92vw,520px);max-height:85vh;border:0;border-radius:14px;padding:24px;color:inherit;box-shadow:0 12px 40px #0004}dialog::backdrop{background:#0008}</style>
<main>
<header><img src="escudo.png" alt="Escudo del club"><div><p>Club Balonmano Pinto</p><h1>Inscripción 2027/2028</h1></div></header>
<p>Prototipo con datos ficticios. Las cuotas, fechas y años de nacimiento son orientativos.</p>
<form id="registration">
<fieldset><legend>Responsable de contacto</legend><div class="grid">
<label>Nombre completo<input name="contact" required></label>
<label>Correo electrónico<input type="email" name="email" required></label>
<label>Teléfono<input type="tel" name="phone" required></label></div>
<label><input name="member" type="checkbox"> Al menos un progenitor ya es socio</label>
</fieldset>
<div id="players"></div>
<button type="button" class="secondary" id="add">Añadir otro jugador</button>
<fieldset><legend>Forma de pago</legend>
<label><input type="radio" name="payment" value="single" checked> Pago único</label>
<label><input type="radio" name="payment" value="split"> Pago fraccionado</label>
</fieldset>
<button type="submit">Revisar inscripción</button>
</form>
<section id="summary" hidden tabindex="-1"><h2>Resumen de la inscripción</h2><ul id="breakdown"></ul><output id="total"></output><p id="schedule"></p><p id="membership"></p><small>El resumen es una simulación. Los datos introducidos se quedan en esta página.</small></section>
</main>
<template id="player">
<fieldset class="player">
<legend></legend>
<div class="grid">
<label>Nombre completo del jugador<input name="playerName" required></label>
<label>Fecha de nacimiento<input name="birth" type="date" required></label>
<label>Rama del equipo<select name="division" required><option value="">Selecciona</option><option value="female">Femenino</option><option value="male">Masculino</option></select></label>
<label class="senior" hidden>Equipo sénior masculino<select name="team" disabled><option value="">Pendiente de confirmar por el club</option><option value="national">Primera Nacional</option><option value="territorial">Territorial</option></select></label>
</div>
<output class="category" aria-live="polite"></output>
<small class="protocol"></small>
<div class="grid">
<label>Nombre para estampar<input name="printName" maxlength="30" required></label>
<label>Talla de camiseta<select name="shirt" required></select></label>
<label>Talla de pantalón<select name="shorts" required></select></label>
</div>
<label><input name="fitted" type="checkbox"> El club ya tomó las tallas presencialmente</label>
<label>Información de salud relevante para la actividad (opcional)<textarea name="health" maxlength="500" rows="2"></textarea></label>
<div class="grid">
<div class="authorization"><a href="#authorizationDetails" data-authorization="outings" aria-haspopup="dialog">Actividades fuera del pabellón</a><select aria-label="Actividades fuera del pabellón" name="outings" required><option value="">Selecciona</option><option>Sí</option><option>No</option></select></div>
<div class="authorization"><a href="#authorizationDetails" data-authorization="transport" aria-haspopup="dialog">Transporte con el equipo</a><select aria-label="Transporte con el equipo" name="transport" required><option value="">Selecciona</option><option>Sí</option><option>No</option></select></div>
<div class="authorization"><a href="#authorizationDetails" data-authorization="images" aria-haspopup="dialog">Publicación de imágenes</a><select aria-label="Publicación de imágenes" name="images" required><option value="">Selecciona</option><option>Sí</option><option>No</option></select></div>
</div>
<button type="button" class="secondary remove">Quitar jugador</button>
</fieldset>
</template>
<dialog id="authorizationDetails" aria-labelledby="authorizationTitle">
<h2 id="authorizationTitle"></h2>
<p id="authorizationText"></p>
<form method="dialog"><button autofocus>Cerrar</button></form>
</dialog>
<script src="inscripcion.js"></script>
</html>
